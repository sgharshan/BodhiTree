<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bodhi — a quiet habit tracker</title>
<meta name="description" content="A calm, personalizable daily/weekly habit tracker that grows a bodhi tree over the year, with Google Drive backup." />
<meta name="theme-color" content="#101d18" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="phone">
    <main id="screen"></main>
    <nav id="tabbar">
      <button data-tab="today" class="tab active" aria-label="Today">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <span>Today</span>
      </button>
      <button data-tab="tree" class="tab" aria-label="Tree">
        <svg viewBox="0 0 24 24"><path d="M12 3c3 2 4.5 4.6 4.5 7A4.5 4.5 0 0 1 12 14.5A4.5 4.5 0 0 1 7.5 10C7.5 7.6 9 5 12 3Z"/><path d="M12 14.5V21M9 21h6"/></svg>
        <span>Tree</span>
      </button>
      <button data-tab="insights" class="tab" aria-label="Insights">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Insights</span>
      </button>
      <button data-tab="grove" class="tab" aria-label="Grove">
        <svg viewBox="0 0 24 24"><path d="M6 11a3.2 3.2 0 1 1 4.2-4.6A3 3 0 1 1 15 10.6A3.2 3.2 0 1 1 18 17H6a3 3 0 0 1 0-6Z"/><path d="M12 17v4"/></svg>
        <span>Grove</span>
      </button>
      <button data-tab="manage" class="tab" aria-label="Manage">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M19.4 13.6a7.6 7.6 0 0 0 0-3.2l1.9-1.4-2-3.4-2.2.7a7.6 7.6 0 0 0-2.8-1.6L14 2.4h-4l-.3 2.3a7.6 7.6 0 0 0-2.8 1.6l-2.2-.7-2 3.4L4.6 10.4a7.6 7.6 0 0 0 0 3.2l-1.9 1.4 2 3.4 2.2-.7a7.6 7.6 0 0 0 2.8 1.6l.3 2.3h4l.3-2.3a7.6 7.6 0 0 0 2.8-1.6l2.2.7 2-3.4Z"/></svg>
        <span>Manage</span>
      </button>
    </nav>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js"></script>
  <script src="js/drive-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
